  WebUI:
    type: library.static
    platform: macOS
    sources: [Packages/WebUI/Sources]
    dependencies:
      - target: ServiceContainer
      - target: Session
      - target: LLM
      - target: Agent
      - target: Tools
    settings:
      base:
        # WebUI 经 Session→GRDB 间接依赖 CSQLite：Xcode 26 不传播 systemLibrary modulemap，显式注入
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  Notifications:
    type: library.static
    platform: macOS
    sources: [Packages/Notifications/Sources]
    dependencies:
      - target: ServiceContainer
  PluginXPC:
    type: library.static
    platform: macOS
    sources: [Packages/PluginXPC/Sources]
    dependencies:
      - target: ServiceContainer
  Sandbox:
    type: library.static
    platform: macOS
    sources: [Packages/Sandbox/Sources]
    dependencies:
      - target: ServiceContainer
  Terminal:
    type: library.static
    platform: macOS
    sources: [Packages/Terminal/Sources]
    dependencies:
      - target: ServiceContainer
  # ---- 可执行 ----
  DSHCLI:
    type: tool
    platform: macOS
    sources: [Apps/DSHCLI/Sources]
    dependencies:
      - target: HarnessCore
      - package: ArgumentParser
        product: ArgumentParser
      - package: GRDB
        product: GRDB
  HarnessApp:
    type: application
    platform: macOS
    sources: [Apps/HarnessApp/Sources]
    dependencies:
      - target: HarnessCore
      - target: ServiceContainer
      - target: Session
      - target: LLM
      - target: Tools
      - target: Agent
      - target: Prompt
      - target: RAG
      - target: Memory
      - target: Notifications
      - target: PluginXPC
      - target: MCP
      - target: Subagent
      - target: Skill
      - target: Terminal
      - target: Sandbox
      - target: Account
      - target: Workspace
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepseek.harness
        PRODUCT_NAME: Harness
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Harness
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        CODE_SIGN_ENTITLEMENTS: Apps/HarnessApp/HarnessApp.ci.entitlements
  MemProbe:
    type: tool
    platform: macOS
    sources: [Apps/MemProbe/Sources]
    dependencies:
      - target: ServiceContainer
      - target: Session
      - target: LLM
      - target: Tools
      - package: GRDB
        product: GRDB
  # ---- 测试 ----
  ServiceContainerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Packages/ServiceContainer/Tests]
    dependencies:
      - target: ServiceContainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harness.ServiceContainerTests
        GENERATE_INFOPLIST_FILE: YES
  SessionTests:
    type: bundle.unit-test
    platform: macOS
