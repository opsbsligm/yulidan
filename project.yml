# XcodeGen 配置 — 由 Package.swift 的 target 结构 1:1 映射
# 重新生成：xcodegen generate
name: swift-harness
options:
  bundleIdPrefix: com.harness
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    version: 6.29.3
  Logging:
    url: https://github.com/apple/swift-log.git
    from: 1.6.0
  Collections:
    url: https://github.com/apple/swift-collections.git
    from: 1.1.0
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser.git
    from: 1.3.0
targets:
  # ---- 本地模块 ----
  ServiceContainer:
    type: library.static
    platform: macOS
    sources: [Packages/ServiceContainer/Sources]
    dependencies:
      - package: Logging
        product: Logging
  Session:
    type: library.static
    platform: macOS
    sources: [Packages/Session/Sources]
    dependencies:
      - target: ServiceContainer
      - package: GRDB
        product: GRDB
    settings:
      base:
        # Xcode 26 不会把 SPM systemLibrary(GRDB/CSQLite) 的 modulemap 传播给
        # 无链接阶段的静态库 target，这里显式注入（字节级一致副本，见 README.txt）
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  Account:
    type: library.static
    platform: macOS
    sources: [Packages/Account/Sources]
    dependencies:
      - target: ServiceContainer
      - target: Workspace
    settings:
      base:
        # Account 经 Workspace→Session→GRDB 间接依赖 CSQLite：
        # Xcode 26 不会把 SPM systemLibrary 的 modulemap 传播给静态库 target，显式注入
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  LLM:
    type: library.static
    platform: macOS
    sources: [Packages/LLM/Sources]
    dependencies:
      - target: ServiceContainer
  Tools:
    type: library.static
    platform: macOS
    sources: [Packages/Tools/Sources]
    dependencies:
      - target: ServiceContainer
      - target: Session
      - target: LLM
      - target: Terminal
      - target: Sandbox
    settings:
      base:
        # Xcode 26 不会把 SPM systemLibrary(GRDB/CSQLite) 的 modulemap 传播给
        # 无链接阶段的静态库 target，这里显式注入（字节级一致副本，见 README.txt）
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  Agent:
    type: library.static
    platform: macOS
    sources: [Packages/Agent/Sources]
    dependencies:
      - target: ServiceContainer
      - target: Session
      - target: LLM
      - target: Tools
    settings:
      base:
        # Xcode 26 不会把 SPM systemLibrary(GRDB/CSQLite) 的 modulemap 传播给
        # 无链接阶段的静态库 target，这里显式注入（字节级一致副本，见 README.txt）
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  HarnessCore:
    type: library.static
    platform: macOS
    sources: [Apps/HarnessCore/Sources]
    dependencies:
      - target: ServiceContainer
      - target: Session
      - target: LLM
      - target: Tools
      - target: Agent
    settings:
      base:
        # Xcode 26 不会把 SPM systemLibrary(GRDB/CSQLite) 的 modulemap 传播给
        # 无链接阶段的静态库 target，这里显式注入（字节级一致副本，见 README.txt）
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  Workspace:
    type: library.static
    platform: macOS
    sources: [Packages/Workspace/Sources]
    dependencies:
      - target: ServiceContainer
      - target: Session
    settings:
      base:
        # Xcode 26 不会把 SPM systemLibrary(GRDB/CSQLite) 的 modulemap 传播给
        # 无链接阶段的静态库 target，这里显式注入（字节级一致副本，见 README.txt）
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  Goal:
    type: library.static
    platform: macOS
    sources: [Packages/Goal/Sources]
