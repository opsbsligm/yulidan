        GENERATE_INFOPLIST_FILE: YES
  AgentTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Packages/Agent/Tests]
    dependencies:
      - target: Agent
      - target: Session
      - target: LLM
      - target: Tools
      - target: Terminal
      - target: Sandbox
      - package: GRDB
        product: GRDB
      - target: ServiceContainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harness.AgentTests
        GENERATE_INFOPLIST_FILE: YES
  # ---- 补齐测试 target（2026-08-29：xcode 门禁对齐全量 SPM 套件，QUALITY_REPORT §四 观察项闭环）----
