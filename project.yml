      base:
        # Xcode 26 不会把 SPM systemLibrary(GRDB/CSQLite) 的 modulemap 传播给
        # 无链接阶段的静态库 target，这里显式注入（字节级一致副本，见 README.txt）
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  Skill:
    type: library.static
    platform: macOS
    sources: [Packages/Skill/Sources]
    dependencies:
      - target: ServiceContainer
      - target: Tools
      - target: RAG
    settings:
      base:
        # Xcode 26 不会把 SPM systemLibrary(GRDB/CSQLite) 的 modulemap 传播给
        # 无链接阶段的静态库 target，这里显式注入（字节级一致副本，见 README.txt）
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  MCP:
    type: library.static
    platform: macOS
    sources: [Packages/MCP/Sources]
    dependencies:
      - target: ServiceContainer
      - target: Tools
    settings:
      base:
        # Xcode 26 不会把 SPM systemLibrary(GRDB/CSQLite) 的 modulemap 传播给
        # 无链接阶段的静态库 target，这里显式注入（字节级一致副本，见 README.txt）
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  Subagent:
    type: library.static
    platform: macOS
    sources: [Packages/Subagent/Sources]
    dependencies:
      - target: ServiceContainer
      - target: Agent
      - target: Session
      - target: LLM
      - target: Tools
    settings:
      base:
        # Xcode 26 不会把 SPM systemLibrary(GRDB/CSQLite) 的 modulemap 传播给
        # 无链接阶段的静态库 target，这里显式注入（字节级一致副本，见 README.txt）
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Support/CSQLite/module.modulemap
  Prompt:
    type: library.static
