name: Swift CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_DERIVED_DATA: ./ci-derived-data

jobs:
  # ==================== PR Pipeline（lint + build + test，快速门禁） ====================
  pr-check:
    name: PR Check (Fast)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint & SwiftFormat
        run: |
          brew install swiftlint swiftformat || true

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: SwiftLint（门禁：0 违规）
        run: swiftlint lint --strict --config .swiftlint.yml

      - name: SwiftFormat（门禁：0 文件需格式化）
        run: swiftformat --lint . --config .swiftformat --reporter github-actions-log

      - name: Build
        run: swift build

      - name: Unit Tests
        run: swift test --parallel

  # ==================== Xcode 工程门禁（xcodegen 重新生成 + build + test） ====================
  xcode-check:
    name: Xcode Build & Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode Build
        run: xcodebuild -project swift-harness.xcodeproj -scheme HarnessApp -configuration Debug -derivedDataPath "$XCODE_DERIVED_DATA" build

      - name: Xcode Test
        run: xcodebuild -project swift-harness.xcodeproj -scheme HarnessApp -configuration Debug -derivedDataPath "$XCODE_DERIVED_DATA" test

  # ==================== 内存泄漏门禁 ====================
  leaks:
    name: Leak Check (MemProbe)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build debug
        run: swift build

      - name: leaks --atExit（期望 0 leaks）
        run: leaks --atExit -- .build/debug/MemProbe 500

  # ==================== Main Pipeline（release + coverage + CodeQL + artifacts） ====================
  main-check:
    name: Main Check (Full)
    runs-on: macos-latest
    needs: [pr-check, xcode-check, leaks]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeQL Init（置于构建前，使构建被 instrumented）
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build Release
        run: swift build --configuration release

      - name: Full Test Suite（带覆盖率）
        run: swift test --parallel --enable-code-coverage

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language/swift"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

      - name: Strip CLI
        run: strip .build/release/dsh

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: dsh-macos
          path: .build/release/dsh
          retention-days: 30

      - name: Build macOS App Artifact
        run: |
          mkdir -p HarnessApp.artifact
          cp -r .build/release/HarnessApp HarnessApp.artifact/
          cd HarnessApp.artifact && zip -r ../HarnessApp-macos.zip HarnessApp

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: HarnessApp-macos
          path: HarnessApp-macos.zip
          retention-days: 30

  # ==================== 每周回归（定时全量测试；依赖升级由 Dependabot 负责） ====================
  weekly-regression:
    name: Weekly Regression
    runs-on: macos-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Full Test Suite
        run: swift test --parallel
