name: Swift CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_DERIVED_DATA: ./ci-derived-data

jobs:
  # ==================== PR Pipeline（lint + build + test，快速门禁） ====================
  pr-check:
    name: PR Check (Fast)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint & SwiftFormat
        run: |
          brew install swiftlint swiftformat || true

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: SwiftLint（门禁：0 违规）
        run: swiftlint lint --strict --config .swiftlint.yml

      - name: SwiftFormat（门禁：0 文件需格式化）
        run: swiftformat --lint . --config .swiftformat --reporter github-actions-log

      - name: Build
        run: swift build

      - name: Unit Tests
        # 有界重试：macOS 存在瞬态协作池调度停滞（线程空闲但任务不派发，~10-13s，见 QUALITY_REPORT P1）；
        # 停滞属环境故障，真实回归重试仍会失败，重试一次用于区分二者
        run: |
          for attempt in 1 2; do
            swift test --parallel && break
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo "⚠️ 首轮全量失败 — 有限重试一次（环境调度停滞容忍，非代码回归）"
          done

  # ==================== Xcode 工程门禁（xcodegen 重新生成 + build + test） ====================
  xcode-check:
    name: Xcode Build & Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode Build
        run: xcodebuild -project swift-harness.xcodeproj -scheme HarnessApp -configuration Debug -derivedDataPath "$XCODE_DERIVED_DATA" build

      - name: Xcode Test
        # 有界重试：同 Unit Tests（macOS 瞬态调度停滞容忍，见 QUALITY_REPORT P1）
        run: |
          for attempt in 1 2; do
            xcodebuild -project swift-harness.xcodeproj -scheme HarnessApp -configuration Debug -derivedDataPath "$XCODE_DERIVED_DATA" test && break
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo "⚠️ 首轮 Xcode Test 失败 — 有限重试一次（环境调度停滞容忍，非代码回归）"
          done

  # ==================== 内存泄漏门禁 ====================
  leaks:
    name: Leak Check (MemProbe)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build debug
        run: swift build

      - name: leaks --atExit（期望 0 leaks）
        run: leaks --atExit -- .build/debug/MemProbe 500

  # ==================== Main Pipeline（release + coverage + CodeQL + artifacts） ====================
  main-check:
    name: Main Check (Full)
    runs-on: macos-latest
    needs: [pr-check, xcode-check, leaks]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 门控：免费私有仓库不可用 CodeQL；启用方法 = Settings→Variables 加 ENABLE_CODEQL=true（需付费计划）
      - name: CodeQL Init（置于构建前，使构建被 instrumented）
        if: vars.ENABLE_CODEQL == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build Release
        run: swift build --configuration release

      - name: Full Test Suite（带覆盖率）
        # 有界重试：macOS 存在瞬态协作池调度停滞（线程空闲但任务不派发，~10-13s，见 QUALITY_REPORT P1）；
        # 停滞属环境故障，真实回归重试仍会失败，重试一次用于区分二者
        run: |
          for attempt in 1 2; do
            swift test --parallel --enable-code-coverage && break
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo "⚠️ 首轮全量失败 — 有限重试一次（环境调度停滞容忍，非代码回归）"
          done

      - name: CodeQL Analysis
        if: vars.ENABLE_CODEQL == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language/swift"

      # 门控：私有仓库需 CODECOV_TOKEN secret；启用方法 = 配好 secret 后 Settings→Variables 加 ENABLE_CODECOV=true
      - name: Upload Coverage
        if: vars.ENABLE_CODECOV == 'true'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

      - name: Strip CLI
        run: strip .build/release/dsh

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: dsh-macos
          path: .build/release/dsh
          retention-days: 30

      - name: Build macOS App Artifact
        run: |
          mkdir -p HarnessApp.artifact
          cp -r .build/release/HarnessApp HarnessApp.artifact/
          cd HarnessApp.artifact && zip -r ../HarnessApp-macos.zip HarnessApp

      - name: Upload macOS App
        uses: actions/upload-artifact@v7
        with:
          name: HarnessApp-macos
          path: HarnessApp-macos.zip
          retention-days: 30
