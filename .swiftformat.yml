# SwiftFormat Configuration — CI Gate
# Rules enabled:
enabled_rules:
  - all

# Disabled rules:
disabled_rules:
  - void_return
  - mark_types
  - mark_structural
  - mark_attributes

# Config:
indent: "    "
line_length: 200
indent_case: true
smart_unicode: false
strip_empty_lines: true
trim_whitespace: true
allman_braces: false
void_return: false
wrappable_conditions: 2
operator_usage: wrapped
argument_continuation: chained_call
indent_switch_scope: false
trim_var_kw: true
self: remove
self_required: explicit

# Excluded paths:
excluded:
  - .build
  - DerivedData
  - .swiftpm
