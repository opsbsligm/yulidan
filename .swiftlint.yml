# SwiftLint 配置 — CI 门禁（swiftlint lint --strict）
disabled_rules:
  - trailing_whitespace
  # trailing_comma：与 SwiftFormat 配置保持一致（不强制尾逗号），避免双工具冲突
  - trailing_comma
  # modifier_order：修饰符顺序以 SwiftFormat 的 modifier-order 规则为准，避免双工具冲突
  - modifier_order

opt_in_rules:
  - empty_count
  - closure_spacing
  - empty_string
  - first_where
  - implicitly_unwrapped_optional
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_break_in_switch
  - vertical_parameter_alignment_on_call

excluded:
  - .build
  - DerivedData
  - ci-derived-data
  - .swiftpm

line_length:
  warning: 200
  error: 300

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1200

function_body_length:
  warning: 60
  error: 120

cyclomatic_complexity:
  warning: 10
  error: 15

large_tuple:
  warning: 3
  error: 5

# 允许 1 字符变量名（i/n/x/t 等惯用短名）；命名决策记录见 docs/CODE_REVIEW.md
identifier_name:
  min_length:
    warning: 1
    error: 0
